name: Platform checks
on:
  pull_request:
  push:
    branches: [main, 'feat/**']
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: therapy
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: therapy
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U therapy'
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group dev
        working-directory: backend
      - run: uv run pytest -q
        working-directory: backend
      - run: uv run --with jsonschema ../scripts/validate_contract_examples.py
        working-directory: backend
      - run: uv run alembic upgrade head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://therapy:local-test-only@localhost:5432/therapy
          JWT_SECRET: ci-only-test-secret-longer-than-thirty-two-characters
      - run: uv run python -m app.seed && uv run python ../scripts/verify_persistence.py
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://therapy:local-test-only@localhost:5432/therapy
          JWT_SECRET: ci-only-test-secret-longer-than-thirty-two-characters
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
