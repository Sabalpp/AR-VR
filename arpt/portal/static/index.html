<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>ARPT · Doctor Portal</title>
<style>
  :root{
    --bg:#0b0f14; --panel:#131a22; --panel2:#1a232e; --line:#243140;
    --txt:#e6edf3; --dim:#8b9bb0; --accent:#39d0d8; --accent2:#5b8cff;
    --green:#34d058; --yellow:#f5c518; --orange:#ff9800; --red:#f4564a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font:14px/1.5 ui-sans-serif,-apple-system,Segoe UI,Roboto,sans-serif;
       background:var(--bg);color:var(--txt);height:100vh;overflow:hidden}
  .app{display:grid;grid-template-columns:340px 1fr;height:100vh}

  /* Sidebar / triage queue */
  .sidebar{background:var(--panel);border-right:1px solid var(--line);
           display:flex;flex-direction:column;overflow:hidden}
  .brand{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;
         align-items:center;gap:10px;cursor:pointer}
  .brand .logo{width:30px;height:30px;border-radius:8px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      display:grid;place-items:center;font-weight:800;color:#04121a}
  .brand h1{font-size:15px;letter-spacing:.3px}
  .brand span{color:var(--dim);font-size:11px;display:block;font-weight:400}
  .queue-hd{padding:12px 20px 8px;font-size:11px;text-transform:uppercase;
            letter-spacing:.6px;color:var(--dim);font-weight:700;
            display:flex;justify-content:space-between}
  .list{overflow-y:auto;flex:1}
  .card{padding:13px 20px;border-bottom:1px solid var(--line);cursor:pointer;
        transition:background .15s;border-left:3px solid transparent}
  .card:hover{background:var(--panel2)}
  .card.active{background:var(--panel2);border-left-color:var(--accent)}
  .card.u-urgent{border-left-color:var(--red)}
  .card.u-soon{border-left-color:var(--yellow)}
  .card .pid{font-weight:600;display:flex;align-items:center;gap:7px}
  .dot{width:7px;height:7px;border-radius:50%}
  .dot.urgent{background:var(--red)} .dot.soon{background:var(--yellow)} .dot.routine{background:var(--green)}
  .card .meta{color:var(--dim);font-size:12px;margin-top:2px}
  .card .row{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
  .pill{font-size:10px;padding:3px 8px;border-radius:20px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .pill.pending{background:#3a2f12;color:var(--yellow)}
  .pill.confirmed{background:#123a1c;color:var(--green)}
  .pill.revised{background:#3a1212;color:var(--red)}

  /* Main */
  .detail{overflow-y:auto;padding:28px 34px}
  .empty{display:grid;place-items:center;height:100%;color:var(--dim)}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start;
       margin-bottom:22px;flex-wrap:wrap;gap:16px}
  .hdr h2{font-size:22px}
  .hdr .sub{color:var(--dim);margin-top:4px;font-size:13px}
  .back{color:var(--accent);cursor:pointer;font-size:13px;margin-bottom:14px;display:inline-block}
  .back:hover{text-decoration:underline}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px}
  .box h3{font-size:12px;text-transform:uppercase;letter-spacing:.6px;
          color:var(--dim);margin-bottom:14px;font-weight:700}
  .full{grid-column:1/-1}
  .complaint{font-style:italic;color:#cdd8e4;border-left:3px solid var(--accent2);
             padding-left:12px;font-size:15px}

  /* stat cards */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:22px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .stat .n{font-size:32px;font-weight:800;line-height:1}
  .stat .l{color:var(--dim);font-size:12px;margin-top:6px;text-transform:uppercase;letter-spacing:.4px}
  .stat.alert .n{color:var(--red)}
  .stat.warn .n{color:var(--yellow)}
  .stat.ok .n{color:var(--green)}

  /* horizontal bars */
  .hbar{margin-bottom:11px}
  .hbar .t{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
  .hbar .track{height:8px;background:#0c1218;border-radius:6px;overflow:hidden}
  .hbar .track>i{display:block;height:100%;border-radius:6px;
      background:linear-gradient(90deg,var(--accent2),var(--accent))}

  /* confidence bars */
  .ail{margin-bottom:14px}
  .ail .top{display:flex;justify-content:space-between;margin-bottom:5px}
  .ail .nm{font-weight:600}
  .ail .cf{font-variant-numeric:tabular-nums;font-weight:700}
  .bar{height:8px;background:#0c1218;border-radius:6px;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:6px;
         background:linear-gradient(90deg,var(--accent2),var(--accent))}
  .ail .why{color:var(--dim);font-size:12px;margin-top:5px}
  .tags{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
  .tag{font-size:11px;background:var(--panel2);padding:2px 8px;border-radius:6px;color:var(--dim)}

  table{width:100%;border-collapse:collapse}
  td{padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
  td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
  .flag-low{color:var(--yellow)} .flag-med{color:var(--orange)} .flag-high{color:var(--red)}
  .flag-ok{color:var(--green)}

  .states{display:flex;gap:8px;margin-top:6px}
  .st{flex:1;text-align:center;padding:10px;border-radius:8px;background:var(--panel2)}
  .st b{display:block;font-size:20px}
  .st.red b{color:var(--red)} .st.yellow b{color:var(--yellow)} .st.green b{color:var(--green)}
  .st small{color:var(--dim);text-transform:uppercase;font-size:10px;letter-spacing:.5px}

  video{width:100%;border-radius:10px;background:#000;margin-top:4px}

  textarea,input,select{width:100%;background:#0c1218;border:1px solid var(--line);
    color:var(--txt);border-radius:8px;padding:10px;font:inherit;margin-top:6px}
  textarea{min-height:80px;resize:vertical}
  label{font-size:12px;color:var(--dim);display:block;margin-top:12px}
  button{margin-top:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));
    color:#04121a;border:0;border-radius:8px;padding:11px 20px;font-weight:700;
    cursor:pointer;font-size:14px}
  button:hover{opacity:.9}
  .badge-ml{font-size:10px;background:#1c2b3a;color:var(--accent);padding:2px 7px;border-radius:5px;margin-left:6px}
  .urgency{padding:4px 12px;border-radius:8px;font-weight:700;font-size:12px}
  .urgency.routine{background:#123a1c;color:var(--green)}
  .urgency.soon{background:#3a2f12;color:var(--yellow)}
  .urgency.urgent{background:#3a1212;color:var(--red)}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand" onclick="showOverview()">
      <div class="logo">A</div>
      <div><h1>ARPT Portal<span>Musculoskeletal screening review</span></h1></div>
    </div>
    <div class="queue-hd"><span>Triage Queue</span><span id="qcount"></span></div>
    <div class="list" id="list"></div>
  </aside>
  <main class="detail" id="detail"></main>
</div>

<script>
const api = (p,o)=>fetch(p,o).then(r=>r.json());
let current=null;

function flagClass(pct){return pct>=60?'flag-high':pct>=35?'flag-med':pct>=15?'flag-low':'flag-ok';}

async function loadQueue(){
  const q = await api('/api/queue');
  const el = document.getElementById('list');
  const pending = q.filter(r=>r.status==='pending').length;
  document.getElementById('qcount').textContent = pending?`${pending} pending`:'all reviewed';
  if(!q.length){el.innerHTML='<div class="card"><div class="meta">No reports yet. Run a session to generate one.</div></div>';return;}
  el.innerHTML = q.map(r=>`
    <div class="card u-${r.urgency} ${r.report_id===current?'active':''}" onclick="loadReport('${r.report_id}')">
      <div class="pid"><span class="dot ${r.urgency}"></span>${r.patient_id}</div>
      <div class="meta">${r.test_name} · ${new Date(r.timestamp_utc).toLocaleDateString()}</div>
      <div class="row">
        <span style="font-size:12px;color:var(--dim)">${r.top_ailment||'—'}${r.top_confidence!=null?` · ${Math.round(r.top_confidence*100)}%`:''}</span>
        <span class="pill ${r.status}">${r.status}</span>
      </div>
    </div>`).join('');
}

async function showOverview(){
  current=null; loadQueue();
  const o = await api('/api/overview');
  const regions = Object.entries(o.by_region||{});
  const ail = Object.entries(o.top_ailments||{});
  const maxR = Math.max(1,...regions.map(x=>x[1]));
  const maxA = Math.max(1,...ail.map(x=>x[1]));
  document.getElementById('detail').innerHTML = `
    <div class="hdr"><div><h2>Clinic Overview</h2>
      <div class="sub">Screening activity across all patients</div></div></div>
    <div class="stats">
      <div class="stat"><div class="n">${o.total}</div><div class="l">Total screened</div></div>
      <div class="stat warn"><div class="n">${o.pending}</div><div class="l">Awaiting review</div></div>
      <div class="stat alert"><div class="n">${o.urgent_pending}</div><div class="l">Urgent · pending</div></div>
      <div class="stat ok"><div class="n">${o.ai_agreement_pct!=null?o.ai_agreement_pct+'%':'—'}</div><div class="l">AI agreement</div></div>
    </div>
    <div class="grid">
      <div class="box"><h3>Affected regions</h3>
        ${regions.length?regions.map(([k,v])=>`<div class="hbar"><div class="t"><span>${k}</span><span>${v}</span></div><div class="track"><i style="width:${v/maxR*100}%"></i></div></div>`).join(''):'<div class="ail"><div class="why">No data yet.</div></div>'}
      </div>
      <div class="box"><h3>Most common findings</h3>
        ${ail.length?ail.map(([k,v])=>`<div class="hbar"><div class="t"><span>${k}</span><span>${v}</span></div><div class="track"><i style="width:${v/maxA*100}%"></i></div></div>`).join(''):'<div class="ail"><div class="why">No data yet.</div></div>'}
      </div>
      <div class="box"><h3>Urgency mix</h3>
        <div class="states">
          <div class="st red"><b>${o.by_urgency?.urgent||0}</b><small>Urgent</small></div>
          <div class="st yellow"><b>${o.by_urgency?.soon||0}</b><small>Soon</small></div>
          <div class="st green"><b>${o.by_urgency?.routine||0}</b><small>Routine</small></div>
        </div>
      </div>
      <div class="box"><h3>Review status</h3>
        <table>
          <tr><td>Confirmed</td><td class="flag-ok">${o.by_status?.confirmed||0}</td></tr>
          <tr><td>Revised by doctor</td><td class="flag-med">${o.by_status?.revised||0}</td></tr>
          <tr><td>Pending</td><td class="flag-low">${o.by_status?.pending||0}</td></tr>
        </table>
      </div>
    </div>`;
}

async function loadReport(id){
  current=id; loadQueue();
  const r = await api('/api/reports/'+id);
  const g = r.diagnosis.gemini||{};
  const ail = g.ailments||[];
  const sym = r.objective_metrics.symmetry||{};
  const rom = r.objective_metrics.range_of_motion||{};
  const mq = r.motion_quality||{};
  const states = mq.state_distribution||{};
  const rev = r.physician_review||{};
  const mlMap = {};
  (r.diagnosis.ml_model||[]).forEach(m=>mlMap[m.condition_id]=m.confidence);

  document.getElementById('detail').innerHTML = `
    <span class="back" onclick="showOverview()">← Overview</span>
    <div class="hdr">
      <div><h2>${r.meta.patient_id}</h2>
        <div class="sub">Report ${r.report_id} · ${r.meta.test_name} · ${r.meta.frame_count} frames · ${r.meta.duration_s}s</div>
      </div>
      <span class="urgency ${g.urgency||'routine'}">${(g.urgency||'routine').toUpperCase()}</span>
    </div>
    <div class="grid">
      <div class="box full"><h3>Patient Complaint</h3>
        <div class="complaint">"${r.patient_report.pain_description}"</div>
        <div class="tags">${(r.patient_report.triage.suspected_conditions||[]).map(c=>`<span class="tag">${c}</span>`).join('')}</div>
      </div>
      <div class="box"><h3>AI Diagnosis · Confidence</h3>
        ${ail.map(a=>{const pct=Math.round((a.confidence||0)*100);
          const ml=mlMap[a.condition_id]!=null?`<span class="badge-ml">ML ${Math.round(mlMap[a.condition_id]*100)}%</span>`:'';
          return `<div class="ail"><div class="top"><span class="nm">${a.name}${ml}</span><span class="cf">${pct}%</span></div>
            <div class="bar"><i style="width:${pct}%"></i></div>
            <div class="why">${a.affected_side||''} · ${a.severity||''} — ${a.reasoning||''}</div></div>`;}).join('')||'<div class="why">No AI diagnosis attached.</div>'}
      </div>
      <div class="box"><h3>Objective Metrics</h3>
        <table>
          <tr><td>Knee asymmetry</td><td class="${flagClass(sym.knee?.asymmetry_pct||0)}">${sym.knee?.asymmetry_pct??'—'}%</td></tr>
          <tr><td>Hip asymmetry</td><td class="${flagClass(sym.hip?.asymmetry_pct||0)}">${sym.hip?.asymmetry_pct??'—'}%</td></tr>
          <tr><td>Ankle asymmetry</td><td class="${flagClass(sym.ankle?.asymmetry_pct||0)}">${sym.ankle?.asymmetry_pct??'—'}%</td></tr>
          <tr><td>Left knee ROM</td><td>${rom.left_knee?.range?.toFixed(1)??'—'}°</td></tr>
          <tr><td>Right knee ROM</td><td>${rom.right_knee?.range?.toFixed(1)??'—'}°</td></tr>
          <tr><td>Pelvic tilt (mean)</td><td>${r.objective_metrics.pelvic_tilt_mean_mm}mm</td></tr>
        </table>
      </div>
      <div class="box"><h3>Movement Replay</h3>
        <video controls src="/api/reports/${id}/video" onerror="this.outerHTML='<div class=why>No replay video attached.</div>'"></video>
      </div>
      <div class="box"><h3>Motion Quality — ${mq.test_id||''} ${mq.accepted?'✓ accepted':'⟳ redo flagged'}</h3>
        <div class="states">
          <div class="st red"><b>${states.red??0}%</b><small>Not moving</small></div>
          <div class="st yellow"><b>${states.yellow??0}%</b><small>In motion</small></div>
          <div class="st green"><b>${states.green??0}%</b><small>Target</small></div>
        </div>
        ${(mq.violations||[]).length?`<div class="why" style="margin-top:10px;color:var(--orange)">Form cues: ${mq.violations.join('; ')}</div>`:''}
      </div>
      <div class="box full"><h3>Key Findings</h3>
        <ul style="padding-left:18px;color:#cdd8e4">
          ${(g.key_findings||[]).map(f=>`<li style="margin-bottom:5px">${f}</li>`).join('')||'<li>—</li>'}
        </ul>
        <div class="why" style="margin-top:12px"><b style="color:var(--txt)">Recommended follow-up:</b> ${g.recommended_followup||'—'}</div>
      </div>
      <div class="box full"><h3>Physician Verification ${rev.status!=='pending'?`· <span class="pill ${rev.status}">${rev.status}</span>`:''}</h3>
        <label>Confirmed diagnosis</label>
        <input id="rev_dx" value="${rev.confirmed_diagnosis||''}" placeholder="e.g. Left meniscal tear, confirmed on exam"/>
        <label>Clinical notes</label>
        <textarea id="rev_notes" placeholder="Exam findings, plan, referrals...">${rev.notes||''}</textarea>
        <label>Reviewing physician</label>
        <input id="rev_by" value="${rev.reviewed_by||''}" placeholder="Dr. Name"/>
        <label>Decision</label>
        <select id="rev_status">
          <option value="confirmed" ${rev.status==='confirmed'?'selected':''}>Confirm AI diagnosis</option>
          <option value="revised" ${rev.status==='revised'?'selected':''}>Revise diagnosis</option>
        </select>
        <button onclick="submitReview('${id}')">Submit Verification</button>
      </div>
    </div>`;
}

async function submitReview(id){
  const body={
    confirmed_diagnosis:document.getElementById('rev_dx').value,
    notes:document.getElementById('rev_notes').value,
    reviewed_by:document.getElementById('rev_by').value||'Dr.',
    status:document.getElementById('rev_status').value,
  };
  await api('/api/reports/'+id+'/review',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  await loadReport(id);
}

showOverview();
setInterval(()=>{ if(!current) loadQueue(); },10000);
</script>
</body>
</html>
